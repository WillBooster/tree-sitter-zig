[package]
authors = ["WillBooster Inc."]
autoexamples = false
categories = ["parser-implementations", "parsing", "text-editors"]
description = "Zig grammar for tree-sitter"
edition = "2024"
keywords = ["incremental", "parsing", "tree-sitter", "zig"]
license = "MIT"
name = "willbooster-tree-sitter-zig"
readme = "README.md"
repository = "https://github.com/WillBooster/tree-sitter-zig"
version = "0.0.0"

build = "bindings/rust/build.rs"
include = [
  "/bindings/rust/*",
  "/grammar.js",
  "/queries/*",
  "/src/*",
  "!/src/.gitattributes",
  "!/src/.editorconfig",
  "/tree-sitter.json",
  "/LICENSE",
]

[lib]
name = "tree_sitter_zig"
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1.6"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = { package = "willbooster-tree-sitter", version = "2.0.0" }
